name: CI
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_amd64
          - os: macos-latest
            arch: osx_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build protobuf-compiler
          else
            brew install ninja protobuf
          fi

      - name: Build (DuckDB + extension, release)
        run: GEN=ninja make release

      - name: sqllogictests
        run: make test_release

      - name: SQL gate (loadable extension in the built CLI)
        run: scripts/gate.sh build/release/extension/hudi/hudi.duckdb_extension build/release/duckdb

      - name: Rust unit tests
        run: cd rust && cargo test
