name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_amd64
          - os: macos-latest
            arch: osx_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y ninja-build protobuf-compiler
          else
            brew install ninja protobuf
          fi

      - name: Build (DuckDB + extension, release)
        run: GEN=ninja make release

      - name: sqllogictests
        run: make test_release

      - name: SQL gate (loadable extension in the built CLI)
        run: scripts/gate.sh build/release/extension/hudi/hudi.duckdb_extension build/release/duckdb

      - name: Rust unit tests
        run: cd rust && cargo test

  # Windows (MSVC): build + smoke only.
  #
  # The full sqllogictest suite is NOT run on Windows yet: two-level
  # hive-style partitioned tables (cow_v6_complexkeygen_hivestyle) are
  # discovered as 0 partitions by the hudi-rs kernel's local object_store on
  # Windows (the same fixture reads 4 rows on Linux/macOS). This is the local
  # path-reading manifestation of the upstream Windows path handling tracked
  # at apache/hudi-rs#445. Until a kernel fix lands, the Windows job verifies
  # that the artifact builds with MSVC, loads, and reads + prunes correctly on
  # the non-partitioned and single-level non-hive fixtures. The full
  # hive-partition pushdown matrix stays on linux/osx.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (DuckDB + extension, release)
        shell: cmd
        run: call scripts\win-build.bat

      - name: Rust unit tests
        working-directory: rust
        run: cargo test

      - name: Windows smoke test (file:// URIs, single-level + non-partitioned fixtures)
        run: pwsh -NoProfile -File scripts/win-smoke.ps1
