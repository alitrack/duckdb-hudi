name: CI
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_amd64
          - os: macos-latest
            arch: osx_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (hudi -> Lance -> prost-build)
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          else
            brew install protobuf
          fi

      - name: Install DuckDB CLI (unsigned gate uses it)
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip -o duckdb.zip
            unzip duckdb.zip -d /usr/local/bin/
            sudo chmod +x /usr/local/bin/duckdb
          else
            curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-osx-universal.zip -o duckdb.zip
            unzip duckdb.zip -d /usr/local/bin/
            chmod +x /usr/local/bin/duckdb
          fi

      - name: Build (configure + release)
        run: make configure && make release

      - name: SQL gate (read_hudi / hudi_info / hudi_files on the in-repo COW fixture)
        run: scripts/gate.sh build/release/hudi.duckdb_extension duckdb
