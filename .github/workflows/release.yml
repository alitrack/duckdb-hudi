name: Release
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux_amd64
          - os: macos-14
            arch: osx_arm64
          - os: macos-13
            arch: osx_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build protobuf-compiler
          else
            brew install ninja protobuf
          fi

      - name: Build (DuckDB + extension, release)
        run: GEN=ninja make release

      - name: SQL gate (platform-specific artifact sanity)
        run: scripts/gate.sh build/release/extension/hudi/hudi.duckdb_extension build/release/duckdb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hudi-${{ matrix.arch }}
          path: build/release/extension/hudi/hudi.duckdb_extension

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hudi-*
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.duckdb_extension
          generate_release_notes: true
