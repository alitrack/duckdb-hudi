[package]
name = "duckdb-hudi"
version = "0.2.1"
edition = "2021"
description = "DuckDB Apache Hudi reader — query Hudi COW/MOR tables via the hudi-rs kernel"
license = "MIT"
repository = "https://github.com/alitrack/duckdb-hudi"

[lib]
name = "hudi"
crate-type = ["cdylib", "rlib"]

[dependencies]
# hudi-rs kernel. default-features=false drops `spill-rocksdb` (the MOR
# merge spill layer, built from source via bindgen) to keep the P0 build light;
# a COW read needs no spill. Re-enable for large MOR merges.
#
# T2 (record_index/locate/bloom) rides hudi-rs #819's public API
# `Table::read_metadata_table_partition_arrow`, not yet on crates.io. Pinned to the
# PR branch's exact commit on the alitrack fork so this branch is self-contained
# and buildable without a local checkout. When #819 lands and releases, flip this
# back to `hudi = { version = "<released>", default-features = false }` and merge
# this branch to master.
hudi = { git = "https://github.com/alitrack/hudi-rs", rev = "e013af819011fa029e54ad8cdc3d71f7cd359084", default-features = false }
quack-rs = { version = "0.18", features = ["duckdb-1-5-4"] }
# Same version as hudi-core's own parquet/arrow deps (58.4.0) so footer types
# unify: `hudi_stats` feeds `ParquetMetaDataReader` output straight into
# `StatisticsContainer::from_parquet_metadata`.
parquet = { version = "58", features = ["async"] }
arrow-cast = "58"
bytes = "1"
libduckdb-sys = { version = ">=1.5.4, <2", features = ["loadable-extension"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "58"

[dev-dependencies]
quack-rs = { version = "0.18", features = ["duckdb-1-5-4", "bundled-test-prebuilt"] }
duckdb = { version = "1.5", features = ["bundled"] }

[features]
default = []
